# Atualizações de segurança e de versão das dependências e das Actions (fixadas por commit).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: main
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    target-branch: main
    schedule:
      interval: weekly
