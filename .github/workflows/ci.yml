name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

# O build só lê o repositório: o token do GitHub não precisa de mais nada.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # Actions fixadas pelo commit (e não pela tag, que pode ser movida); o Dependabot propõe as atualizações.
      - name: Checkout do código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # o token não fica salvo no .git, onde um script de dependência conseguiria ler
          persist-credentials: false

      - name: Configurar Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build da aplicação
        run: npm run build
